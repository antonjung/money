<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>Money</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f1512">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Money">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header>
      <div class="header-row">
        <h1>Money</h1>
        <button id="shareBtn" class="icon-btn" aria-label="Sharing">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
        </button>
      </div>
      <div id="version"></div>
    </header>

    <main>
      <section id="spendView" class="view">
        <div class="month-banner">
          <span id="currentMonthLabel"></span>
          <span id="currentMonthTotal"></span>
        </div>

        <div id="noCategoriesMsg" class="empty-state hidden">
          <p class="muted">No categories yet.</p>
          <button id="emptyAddCategoryBtn" class="btn btn-secondary" type="button">+ Add category</button>
        </div>

        <form id="spendForm">
          <div class="field">
            <label>Category</label>
            <button type="button" id="categoryTrigger" class="dropdown-trigger">
              <span id="categoryTriggerLabel">Select category</span>
              <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
            </button>
            <div id="categoryDropdown" class="dropdown-list hidden"></div>
          </div>
          <div class="field">
            <label for="amountInput">Amount</label>
            <div class="input-row">
              <span class="unit">£</span>
              <input id="amountInput" type="number" step="0.01" min="0.01" inputmode="decimal" placeholder="0.00">
            </div>
          </div>
          <button type="submit" class="btn btn-primary">Add spend</button>
        </form>
      </section>

      <section id="historyView" class="view hidden">
        <div class="month-banner">
          <span id="historyMonthLabel"></span>
          <span id="historyMonthTotal"></span>
        </div>

        <ul id="spendList" class="spend-list"></ul>
      </section>

      <section id="reportView" class="view hidden">
        <div class="field">
          <label>Period</label>
          <div class="field-row">
            <button type="button" id="monthTrigger" class="dropdown-trigger">
              <span id="monthTriggerLabel">Select period</span>
              <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
            </button>
            <button id="renameMonthBtn" class="icon-btn-square" aria-label="Rename period" type="button">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
            </button>
            <button id="deleteMonthBtn" class="icon-btn-square danger" aria-label="Delete period" type="button">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
            </button>
          </div>
          <div id="monthDropdown" class="dropdown-list hidden"></div>
        </div>

        <div class="field">
          <label>Compare with</label>
          <button type="button" id="compareMonthTrigger" class="dropdown-trigger">
            <span id="compareMonthTriggerLabel">Select period</span>
            <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
          <div id="compareMonthDropdown" class="dropdown-list hidden"></div>
        </div>

        <button id="startMonthBtn" class="btn btn-secondary">Start new period</button>

        <div id="reportTotal" class="report-total"></div>
        <ul id="categoryBreakdown" class="breakdown-list"></ul>
      </section>

      <section id="categoriesView" class="view hidden">
        <button id="addCategoryBtn" class="btn btn-primary" type="button">+ Add category</button>
        <ul id="categoryList" class="category-list"></ul>
      </section>
    </main>

    <nav class="bottom-nav">
      <button class="nav-tab active" data-view="spend">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
        <span>Home</span>
      </button>
      <button class="nav-tab" data-view="history">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
        <span>List</span>
      </button>
      <button class="nav-tab" data-view="report">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/></svg>
        <span>Summary</span>
      </button>
      <button class="nav-tab" data-view="categories">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.59 13.41L13.42 20.58a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>
        <span>Categories</span>
      </button>
    </nav>
  </div>

  <dialog id="shareDialog">
    <div class="dialog-content">
      <h2>Sharing</h2>
      <div id="groupStatus" class="group-status"></div>
      <div id="groupJoinForm">
        <input id="groupNameInput" type="text" placeholder="Group name" autocomplete="off">
        <input id="groupPinInput" type="text" inputmode="numeric" placeholder="PIN" autocomplete="off">
        <button id="joinGroupBtn" class="btn btn-secondary">Join / create group</button>
        <p class="muted small">Anyone using the same group name + PIN shares this data live.</p>
      </div>
      <button id="inviteGroupBtn" class="btn btn-secondary hidden">Invite others</button>
      <button id="leaveGroupBtn" class="btn btn-ghost hidden">Leave group</button>

      <button id="closeShareBtn" class="btn btn-ghost">Close</button>
    </div>
  </dialog>

  <dialog id="renameMonthDialog">
    <div class="dialog-content">
      <h2>Rename period</h2>
      <div class="field">
        <label for="renameMonthInput">Period name</label>
        <input id="renameMonthInput" type="text">
      </div>
      <div class="dialog-actions">
        <button id="renameMonthCancelBtn" class="btn btn-ghost">Cancel</button>
        <button id="renameMonthConfirmBtn" class="btn btn-primary">Save</button>
      </div>
    </div>
  </dialog>

  <dialog id="startMonthDialog">
    <div class="dialog-content">
      <h2>Start new period</h2>
      <p id="startMonthMessage" class="muted"></p>
      <div class="field">
        <label for="newMonthNameInput">Period name</label>
        <input id="newMonthNameInput" type="text">
      </div>
      <div class="dialog-actions">
        <button id="startMonthCancelBtn" class="btn btn-ghost">Cancel</button>
        <button id="startMonthConfirmBtn" class="btn btn-danger">Start period</button>
      </div>
    </div>
  </dialog>

  <dialog id="addCategoryDialog">
    <div class="dialog-content">
      <h2>Add category</h2>
      <div class="field">
        <label for="newCategoryNameInput">Name</label>
        <input id="newCategoryNameInput" type="text" placeholder="e.g. Groceries" autocomplete="off">
      </div>
      <div class="field">
        <label for="newCategoryBudgetInput">Monthly budget (optional)</label>
        <div class="input-row">
          <span class="unit">£</span>
          <input id="newCategoryBudgetInput" type="number" min="0" step="0.01" inputmode="decimal" placeholder="0.00">
        </div>
      </div>
      <div class="dialog-actions">
        <button id="addCategoryCancelBtn" class="btn btn-ghost">Cancel</button>
        <button id="addCategoryConfirmBtn" class="btn btn-primary">Add category</button>
      </div>
    </div>
  </dialog>

  <dialog id="confirmDialog">
    <div class="dialog-content">
      <h2 id="confirmTitle">Are you sure?</h2>
      <p id="confirmMessage" class="muted"></p>
      <div class="dialog-actions">
        <button id="confirmCancelBtn" class="btn btn-ghost">Cancel</button>
        <button id="confirmOkBtn" class="btn btn-danger">Confirm</button>
      </div>
    </div>
  </dialog>

  <div id="updateBanner" class="hidden">
    <span id="updateBannerText">New version available</span>
    <button id="reloadBtn">Reload</button>
    <button id="dismissUpdateBtn" aria-label="Dismiss">✕</button>
  </div>

  <div id="toast"></div>

  <script src="firebase-config.js"></script>
  <script src="app.js"></script>
</body>
</html>
